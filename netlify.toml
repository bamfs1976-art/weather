# Netlify build configuration.
#
# Secrets do NOT belong here — this file is committed. Set XWEATHER_CLIENT_ID
# and XWEATHER_CLIENT_SECRET under Site configuration → Environment variables,
# scoped so that Functions can see them (the App Router API routes run as
# Netlify Functions and read the credentials at request time).

[build]
  # COMMIT_REF is set by Netlify. Passing it through as a NEXT_PUBLIC_ variable
  # bakes the commit into the client bundle, so the running build is visible in
  # the app itself — the only reliable way to tell a real fault from a phone
  # still serving an old cached bundle.
  command = "NEXT_PUBLIC_BUILD_REF=$COMMIT_REF npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify auto-detects Next.js, but declaring the plugin keeps the runtime
# explicit and pinned to the repo rather than to UI state.
[[plugins]]
  package = "@netlify/plugin-nextjs"
